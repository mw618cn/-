[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tdm-restore"
version = "0.1.0"
description = "24h transmission-distribution-microgrid resilience restoration research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7", "python-docx>=1.1", "pandas>=2.0", "openpyxl>=3.1"]
[project.scripts]
tdm-restore = "tdm_restore.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
